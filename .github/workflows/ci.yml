name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,llm]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
      - run: throughline --ledger /tmp/ledger.sqlite study --pack insurance --profile quick --out /tmp/results
      - run: throughline --ledger /tmp/ledger.sqlite ledger verify
