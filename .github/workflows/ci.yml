name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,llm,viz]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests with coverage
        run: pytest -q --cov=agentic_ops_twin --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.python-version == '3.13'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Line coverage: {rate:.1f}%")
          PY
      - name: End-to-end smoke (quick study + ledger)
        run: |
          ops-twin --ledger /tmp/ledger.sqlite study --pack insurance --profile quick --out /tmp/results
          ops-twin --ledger /tmp/ledger.sqlite ledger verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
