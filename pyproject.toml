[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-ops-twin"
version = "0.1.0"
description = "Capacity-aware operating-model simulation with governed, agent-assisted scenario analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Agentic Ops Twin contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "simpy>=4.1,<5",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
viz = ["matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ops-twin = "agentic_ops_twin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ops_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer statistical tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agentic_ops_twin.simulation.*"
strict = true
